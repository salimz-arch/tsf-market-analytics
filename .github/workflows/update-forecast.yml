name: update-forecast

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run forecasting pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m src.ingest_crypto
          python -m src.ingest_stock
          python -m src.ingest_commodities
          python -m src.build_dataset
          python -m src.train
          python -m src.forecast_latest
          python -m src.evaluate
          python -m src.analyst

      - name: Commit & push hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data models
          git commit -m "chore: auto-update forecast [skip ci]" || echo "tidak ada perubahan"
          git push
